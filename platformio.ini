[platformio]
src_dir = main

[env:wechat-esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf
; The board definition says N8 (8 MB) but this chip reports 16 MB. Override
; both the esptool header and the linker view of flash.
board_upload.flash_size = 16MB
upload_speed = 460800
upload_port = COM9
monitor_speed = 115200
monitor_port = COM9
board_build.flash_mode = dio
board_build.f_flash = 80000000L
board_build.partitions = partitions.csv
build_flags =
    -DIDF_TARGET_ESP32S3
